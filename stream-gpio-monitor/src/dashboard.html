<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirob GPIO monitor</title>
<style>
  :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; color: #172922; background: #f4f7f4; --muted: #50635b; --accent: #11654b; --line: #d5e0d9; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1060px; margin: auto; padding: clamp(16px, 5vw, 48px); }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.035em; }
  p { margin: 0; }
  #status { color: var(--muted); overflow-wrap: anywhere; }
  #status.live { color: var(--accent); }
  .metric { border: 1px solid var(--line); background: white; padding: 8px 14px; border-radius: 10px; }
  .metric span { color: var(--muted); margin-right: 8px; }
  #rtt { display: inline-block; min-width: 5.5ch; }
  nav { display: flex; gap: 6px; margin-top: 24px; border-bottom: 1px solid var(--line); }
  button { font: inherit; cursor: pointer; background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; padding: 10px 12px 9px; }
  button:hover { background: #e9f1eb; }
  button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .plot-key { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); margin-top: 10px; font-size: .88rem; }
  .plot-key span { display: inline-flex; gap: 6px; align-items: center; }
  .plot-key i { display: inline-block; width: 18px; border-top: 2px solid #274a6a; }
  .plot-key .smooth { border-color: #a45808; border-top-style: dashed; }
  .plot { display: block; width: 100%; height: 36px; }
  .load-plot .plot { height: 46px; }
  .load-plot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .load-plot .axis { flex-direction: column; text-align: right; height: 46px; margin: 0; }
  .axis { display: flex; justify-content: space-between; gap: 4px; font-size: .72rem; font-weight: 400; margin-top: 2px; }
  .reading { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .plot-column { width: 62%; min-width: 180px; }
  .table-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; background: white; }
  table { border-spacing: 0; width: 100%; min-width: 520px; text-align: left; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 12px; white-space: nowrap; }
  thead { background: #edf3ee; color: var(--muted); font-size: .87rem; }
  tbody + tbody :is(th, td) { border-top: 1px solid var(--line); }
  tbody th { font-weight: 650; }
  tbody tr:hover { background: #f5f8f5; }
  .level { display: inline-block; width: 4.6em; text-align: center; background: #edf1ef; color: #465950; font-weight: 650; font-size: .78rem; border-radius: 5px; padding: 2px 0; }
  .level.high { color: #08553b; background: #daf0e5; }
  .alpha { display: flex; align-items: center; gap: 8px; }
  .alpha input { width: clamp(68px, 14vw, 138px); accent-color: var(--accent); cursor: pointer; }
  .alpha output { width: 4ch; }
  footer { color: var(--muted); margin: 8px 0 0; font-size: .88rem; }
  #error { color: #962b26; }
  @media (max-width: 600px) {
    main { padding: 14px; }
    h1 { font-size: 1.6rem; }
    table { min-width: 345px; font-size: .85rem; }
    thead { font-size: .76rem; }
    th, td { padding-inline: 5px; }
    .level { width: 3.7em; font-size: .7rem; }
    .plot-column { min-width: 145px; }
    .alpha { gap: 4px; }
    .alpha input { width: 53px; margin-inline: 0; }
  }
</style>
<main>
  <header>
    <div><h1>Spirob GPIO monitor</h1><p id="status" role="status">Connecting…</p></div>
    <p class="metric" title="WebSocket ping/pong round-trip time"><span>WebSocket RTT</span><strong id="rtt">—</strong></p>
  </header>
  <nav role="tablist" aria-label="GPIO groups">
    <button id="hx711-tab" role="tab" aria-controls="hx711" aria-selected="true">HX711</button>
    <button id="motor-tab" role="tab" aria-controls="motor" aria-selected="false" tabindex="-1">Motor outputs</button>
  </nav>
  <div class="plot-key">
    <span><i aria-hidden="true"></i>Measured load / GPIO level</span>
    <span><i class="smooth" aria-hidden="true"></i>EMA</span>
  </div>
  <section id="hx711" role="tabpanel" aria-labelledby="hx711-tab"></section>
  <section id="motor" role="tabpanel" aria-labelledby="motor-tab" hidden></section>
  <footer>
    <p>EMA high is the smoothed share of HIGH samples. Scroll over an alpha slider or use its arrow keys to adjust smoothing. Short pulses can fall between samples.</p>
    <p id="error" role="alert"></p>
  </footer>
</main>
<script>
  const groups = [
    { id: 'hx711', signals: ['DOUT', 'SCK'], pins: [[2,3],[5,6],[7,11],[21,13],[17,20],[12,19]] },
    { id: 'motor', signals: ['PUL', 'DIR'], pins: [[18,14],[10,9],[4,27],[23,1],[22,25],[26,0]] },
  ];
  const controls = new Map();
  const windowMs = 10_000;
  let history = [];
  let cursor = 0;
  const error = document.querySelector('#error');
  for (const { id, signals, pins } of groups) {
    const panel = document.getElementById(id);
    panel.innerHTML = `<div class="table-wrap" tabindex="0" aria-label="GPIO channels"><table>
      <thead><tr><th>Motor</th><th>Signal</th><th>BCM</th><th class="plot-column">GPIO history<div class="axis"><span>−10 s</span><span>−5 s</span><span>Latest</span></div></th><th>Latest</th><th>EMA alpha</th></tr></thead>
      ${pins.map((pair, motor) => `<tbody>${pair.map((pin, line) => `<tr>
        <th scope="row">Motor ${motor}</th><td>${signals[line]}</td><td>${pin}</td>
        <td><canvas class="plot" role="img" aria-label="Motor ${motor} ${signals[line]} GPIO and EMA history"></canvas></td>
        <td><span class="level">—</span><div class="reading"><output>—</output></div></td>
        <td><label class="alpha"><input type="range" min="1" max="100" value="20" data-pin="${pin}" aria-label="Motor ${motor} ${signals[line]} EMA alpha" disabled><output>0.20</output></label></td>
        </tr>`).join('')}</tbody>`).join('')}</table></div>`;
    for (const row of panel.querySelectorAll('tbody tr')) {
      const slider = row.querySelector('input');
      const pin = Number(slider.dataset.pin);
      const control = { slider, level: row.querySelector('.level'), plot: row.querySelector('canvas'),
        ema: row.querySelector('.reading output'), alpha: row.querySelector('.alpha output'), saving: false };
      controls.set(pin, control);
      const setAlpha = (value) => {
        slider.value = value;
        control.alpha.textContent = (value / 100).toFixed(2);
        slider.setAttribute('aria-valuetext', control.alpha.textContent);
      };
      control.setAlpha = setAlpha;
      const save = async () => {
        if (control.saving) return;
        control.saving = true;
        try {
          let value;
          do {
            value = slider.value;
            const result = await fetch(`/api/alpha/${pin}/${value}`, {method: 'PUT', headers: {'x-gpio-monitor': '1'}});
            if (!result.ok) throw Error();
          } while (slider.value !== value);
          error.textContent = '';
        } catch {
          error.textContent = `Could not save alpha for GPIO ${pin}.`;
        } finally {
          control.saving = false;
        }
      };
      slider.addEventListener('input', () => { setAlpha(slider.value); save(); });
      slider.addEventListener('wheel', (event) => {
        if (slider.disabled || event.ctrlKey || !event.deltaY) return;
        event.preventDefault();
        setAlpha(Math.min(100, Math.max(1, Number(slider.value) - Math.sign(event.deltaY))));
        save();
      }, {passive: false});
    }
  }

  const hx711 = document.querySelector('#hx711');
  hx711.insertAdjacentHTML('afterbegin', `<div class="table-wrap" tabindex="0" aria-label="HX711 loads"><table>
    <thead><tr><th>Motor</th><th>Raw counts</th><th>Load (kg)</th>
      <th class="plot-column">Load history (kg) · EMA α 0.20<div class="axis"><span>−10 s</span><span>−5 s</span><span>Latest</span></div></th></tr></thead>
    <tbody>${groups[0].pins.map((_, motor) => `<tr><th scope="row">Motor ${motor}</th><td>—</td><td>—</td>
      <td><div class="load-plot"><canvas class="plot" role="img" aria-label="Motor ${motor} load and EMA history in kg"></canvas>
      <div class="axis"><span>—</span><span>—</span></div></div></td></tr>`).join('')}</tbody>
    </table></div>`);
  const loadRows = hx711.querySelectorAll('.table-wrap:first-child tbody tr');
  const plots = [
    ...Array.from(loadRows, (row, motor) => ({
      plot: row.querySelector('canvas'), axis: row.querySelectorAll('.axis span'),
      value: (point, raw) => (raw ? point.kg : point.kg_ema)[motor],
    })),
    ...Array.from(controls, ([pin, {plot}]) => ({
      plot, stepped: true, value: (point, raw) => raw ? (point.levels >>> pin) & 1 : point.ema[pin] / 100,
    })),
  ];

  const tabs = [...document.querySelectorAll('[role=tab]')];
  function selectTab(index) {
    tabs.forEach((tab, i) => {
      tab.setAttribute('aria-selected', i === index);
      tab.tabIndex = i === index ? 0 : -1;
      document.getElementById(tab.getAttribute('aria-controls')).hidden = i !== index;
    });
    drawPlots();
  }
  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => selectTab(index));
    tab.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? 1 : 1 - index;
      selectTab(next);
      tabs[next].focus();
    });
  });

  const status = document.querySelector('#status');
  const rtt = document.querySelector('#rtt');
  function render(state) {
    const text = state ? `${state.target} · ${state.status}` : 'Dashboard disconnected';
    if (status.textContent !== text) status.textContent = text;
    status.classList.toggle('live', Boolean(state?.live));
    rtt.textContent = state?.rtt_ms == null ? '—' : `${state.rtt_ms.toFixed(1)} ms`;
    loadRows.forEach((row, motor) => {
      const reading = state?.hx711?.[motor];
      row.cells[1].textContent = reading ? reading.raw.toFixed(1) : '—';
      row.cells[2].textContent = reading ? reading.kg.toFixed(3) : '—';
    });
    for (const [pin, control] of controls) {
      const channel = state?.channels[pin];
      control.level.textContent = channel?.level == null ? '—' : channel.level ? 'HIGH' : 'LOW';
      control.level.classList.toggle('high', channel?.level === true);
      control.ema.textContent = channel?.ema == null ? '—' : `${(channel.ema * 100).toFixed(1)}%`;
      control.slider.disabled = !channel;
      if (channel && !control.saving && control.slider.value !== String(channel.alpha)) control.setAlpha(channel.alpha);
    }
  }

  function drawPlots() {
    const end = history.at(-1)?.t;
    const scale = window.devicePixelRatio || 1;
    for (const {plot, axis, stepped, value} of plots) {
      const width = Math.round(plot.clientWidth * scale);
      const height = Math.round(plot.clientHeight * scale);
      if (!width || !height) continue;
      if (plot.width !== width) plot.width = width;
      if (plot.height !== height) plot.height = height;
      const ctx = plot.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      let low = 0;
      let high = 1;
      if (axis) {
        const values = history.flatMap(point => [value(point, true), value(point, false)]).filter(Number.isFinite);
        axis[0].textContent = axis[1].textContent = '—';
        if (!values.length) continue;
        low = Math.floor(Math.min(...values) * 1000) / 1000;
        high = Math.ceil(Math.max(...values) * 1000) / 1000;
        if (low === high) {
          low -= 0.001;
          high += 0.001;
        }
        axis[0].textContent = high.toFixed(3);
        axis[1].textContent = low.toFixed(3);
      }
      const pad = 3 * scale;
      const y = (value) => height - pad - value * (height - 2 * pad) + 0.5;
      ctx.lineWidth = scale;
      ctx.strokeStyle = '#d5e0d9';
      ctx.beginPath();
      for (const value of [0, 0.5, 1]) {
        ctx.moveTo(0, y(value));
        ctx.lineTo(width, y(value));
      }
      ctx.moveTo(width / 2, pad);
      ctx.lineTo(width / 2, height - pad);
      ctx.stroke();
      if (end == null) continue;

      for (const raw of [true, false]) {
        ctx.strokeStyle = raw ? '#274a6a' : '#a45808';
        ctx.lineWidth = (raw ? 1.5 : 1.7) * scale;
        ctx.setLineDash(raw ? [] : [4 * scale, 3 * scale]);
        ctx.beginPath();
        let previous = null;
        for (const point of history) {
          const x = (1 - (end - point.t) / windowMs) * (width - scale);
          const sample = value(point, raw);
          if (sample == null) {
            previous = null;
            continue;
          }
          const level = y((sample - low) / (high - low));
          if (!previous || point.t - previous.t > 250) {
            ctx.moveTo(x - scale, level);
          } else if (raw && stepped) {
            ctx.lineTo(x, previous.level);
          }
          ctx.lineTo(x, level);
          previous = {t: point.t, level};
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  addEventListener('resize', drawPlots);

  async function refresh() {
    try {
      const result = await fetch(`/api/state?after=${cursor}`, {signal: AbortSignal.timeout(1500)});
      if (!result.ok) throw Error();
      const state = await result.json();
      if (state.reset || (state.history.length && state.history[0].t < (history.at(-1)?.t ?? 0))) history = [];
      history.push(...state.history);
      cursor = history.at(-1)?.id ?? 0;
      const latest = history.at(-1)?.t;
      history = history.filter(point => latest - point.t <= windowMs);
      render(state);
      if (state.history.length || state.reset) drawPlots();
    } catch { render(null); }
    setTimeout(refresh, 100);
  }
  refresh();
</script>
</html>
