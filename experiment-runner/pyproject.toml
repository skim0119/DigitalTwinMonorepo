[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spirob-experiment-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.6,<4"]

[project.scripts]
experiment-runner-server = "experiment_runner.server:main"

[tool.setuptools.package-data]
experiment_runner = ["config.ini"]
