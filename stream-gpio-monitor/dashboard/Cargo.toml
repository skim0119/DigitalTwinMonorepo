[package]
name = "spirob-dashboard"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["minimal", "web"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["AbortController", "Document", "HtmlElement", "Window"] }
