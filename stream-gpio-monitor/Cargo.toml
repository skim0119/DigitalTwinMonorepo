[package]
name = "stream-gpio-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30.0"
